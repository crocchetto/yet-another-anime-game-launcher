name: "Build Latest (when new tag created)"
on:
  push:
    tags:
      - '*'
env:
  YAAGL_VERSION: ${{ github.ref_name }}
permissions:
  contents: "write"
  packages: "write"
  pull-requests: "read"
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - uses: pnpm/action-setup@v2
        name: Install pnpm
        id: pnpm-install
        with:
          version: 7
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v3
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build app
        run: |
          ./configure.sh
          for i in 1 2 3; do
            YAAGL_CHANNEL_CLIENT=generic YAAGL_GENERIC_INSTANCE=$i node ./build-app.js
            cp dist/Yaagl/resources.neu resources_generic$i.neu
          done

      - name: Setup Node 20 for DMG creation
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tar app and Create DMG
        run: |
          npm install -g create-dmg

          for i in 1 2 3; do
            tar -zcf "Yaagl Generic $i.app.tar.gz" "Yaagl Generic $i.app"
            create-dmg --no-code-sign --dmg-title="Yaagl Generic $i" "Yaagl Generic $i.app" || true
            mv "Yet Another Anime Game Launcher "*.dmg "Yaagl Generic $i.dmg"
          done

      - name: Generate prerelease
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          draft: true
          prerelease: false
          title: "Release ${{ github.ref_name }}"
          files: |
            *.dmg
            *.app.tar.gz
            resources_generic1.neu
            resources_generic2.neu
            resources_generic3.neu
